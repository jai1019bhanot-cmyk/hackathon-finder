<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hackathon Finder</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#9aa0a6; --accent:#6c8cff; --border:#2a2e38; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6fa; --card:#fff; --text:#1c1e24; --muted:#5f6368; --accent:#3b5bdb; --border:#dfe1e8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:28px 20px 8px; max-width:1100px; margin:auto; }
  h1 { margin:0 0 4px; font-size:1.8rem; }
  .sub { color:var(--muted); margin:0; }
  .filters { max-width:1100px; margin:16px auto; padding:0 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  input[type=text], select { padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:1rem; }
  input[type=text] { flex:1; min-width:180px; }
  label { color:var(--muted); display:flex; align-items:center; gap:6px; }
  .grid { max-width:1100px; margin:auto; padding:0 20px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .card h3 { margin:0; font-size:1.05rem; }
  .score { align-self:flex-start; background:var(--accent); color:#fff; font-weight:700; padding:2px 10px; border-radius:20px; font-size:.85rem; }
  .meta { color:var(--muted); font-size:.9rem; }
  .reason { font-size:.95rem; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { border:1px solid var(--border); border-radius:20px; padding:2px 8px; font-size:.78rem; color:var(--muted); }
  a.btn { margin-top:auto; text-align:center; background:var(--accent); color:#fff; text-decoration:none; padding:9px; border-radius:8px; font-weight:600; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px; }
</style>
</head>
<body>
<header>
  <h1>🚀 AI Hackathon Finder</h1>
  <p class="sub" id="count">Loading…</p>
</header>
<div class="filters">
  <input type="text" id="search" placeholder="Search hackathons…">
  <select id="theme"><option value="All">All themes</option></select>
  <label><input type="checkbox" id="online"> Online only</label>
  <label>Min score <input type="range" id="score" min="0" max="10" value="5"> <span id="scoreVal">5</span></label>
</div>
<div class="grid" id="grid"></div>

<script>
let DATA = [];
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render() {
  const q = $("search").value.toLowerCase();
  const theme = $("theme").value;
  const online = $("online").checked;
  const min = +$("score").value;
  $("scoreVal").textContent = min;

  const list = DATA.filter(e =>
    (e.score ?? 0) >= min &&
    (!online || e.online) &&
    (theme === "All" || e.themes.includes(theme)) &&
    (!q || e.title.toLowerCase().includes(q))
  );

  $("count").textContent = list.length + " hackathons shown";
  $("grid").innerHTML = list.length ? list.map(e => `
    <div class="card">
      <span class="score">${esc(e.score ?? "-")}/10</span>
      <h3>${esc(e.title)}</h3>
      <div class="meta">💰 ${esc(e.prize)} · ⏳ ${esc(e.time_left)} · 📍 ${esc(e.location)}</div>
      <div class="meta">📅 ${esc(e.deadline)} · by ${esc(e.organizer)}</div>
      <div class="reason">${esc(e.reason)}</div>
      <div class="tags">${e.themes.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">View & register</a>
    </div>`).join("") : '<div class="empty">No hackathons match.</div>';
}

fetch("data.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => {
    DATA = d;
    const themes = [...new Set(d.flatMap(e => e.themes))].sort();
    $("theme").innerHTML = '<option value="All">All themes</option>' +
      themes.map(t => `<option>${esc(t)}</option>`).join("");
    render();
  })
  .catch(() => { $("count").textContent = "Couldn't load data.json"; });

["search","theme","online","score"].forEach(id => $(id).addEventListener("input", render));
</script>
</body>
</html>
